name: Update README with Brainfuck

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-brainfuck
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Avoid the JavaScript-based actions/checkout action entirely.
      - name: Checkout using Git only
        shell: bash
        run: |
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Build native Brainfuck runner
        run: cc -O2 -Wall -Wextra -Werror -o scripts/bf_run scripts/bf_run.c
      - name: Test Brainfuck logic
        run: python3 -m unittest discover -s tests -v
      - name: Update dynamic README sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py --owner MrxSiN --langs preferred
      - name: Commit changes only if needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo 'README unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update Brainfuck hours and languages'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
